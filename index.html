<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Tập Trực Tuyến</title>
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #10B981;
            --bg-color: #F3F4F6;
            --surface: #FFFFFF;
            --text-main: #1F2937;
            --text-light: #6B7280;
            --danger: #EF4444;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

        /* Banner & Header */
        header { background: var(--surface); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links button { background: none; border: none; font-size: 16px; font-weight: 600; color: var(--text-light); cursor: pointer; transition: 0.3s; }
        .nav-links button:hover, .nav-links button.active { color: var(--primary); }
        .btn-logout { color: var(--danger) !important; }

        /* Main Content */
        main { flex: 1; padding: 40px 20px; max-width: 1000px; margin: 0 auto; width: 100%; }
        .view-section { display: none; animation: fadeIn 0.4s ease; }
        .view-section.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Auth Forms (Đăng nhập/Đăng ký) */
        .auth-container { background: var(--surface); padding: 40px; border-radius: 12px; box-shadow: var(--shadow); max-width: 400px; margin: 50px auto; text-align: center; }
        .auth-container h2 { margin-bottom: 20px; color: var(--primary); }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 14px; margin-bottom: 5px; color: var(--text-light); }
        .input-group input, .input-group select { width: 100%; padding: 10px 15px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus, .input-group select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: var(--bg-color); color: var(--text-main); }
        .btn-secondary:hover { background: #E5E7EB; }
        #authMessage { font-size: 14px; margin-top: 10px; color: var(--danger); }

        /* Cards (Tài liệu & Bài tập) */
        .page-title { font-size: 24px; margin-bottom: 20px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; display: inline-block; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: var(--surface); padding: 20px; border-radius: 10px; box-shadow: var(--shadow); transition: 0.3s; display: flex; flex-direction: column; align-items: flex-start; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .card i { font-size: 30px; color: var(--primary); margin-bottom: 15px; }
        .card h4 { margin-bottom: 10px; font-size: 16px; word-break: break-word; }
        .card a { margin-top: auto; text-decoration: none; background: var(--primary); color: white; padding: 8px 15px; border-radius: 6px; font-size: 14px; font-weight: 600; transition: 0.3s; }
        .card a:hover { background: var(--primary-hover); }

        .alert-box { background: #FEE2E2; color: var(--danger); padding: 15px; border-radius: 8px; font-weight: 600; text-align: center; margin-top: 20px; }

        /* Floating Chatbot */
        .chatbot-toggle { position: fixed; bottom: 30px; right: 30px; background: var(--primary); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4); transition: 0.3s; z-index: 1000; }
        .chatbot-toggle:hover { transform: scale(1.1); }
        .chatbot-window { position: fixed; bottom: 100px; right: 30px; width: 350px; height: 450px; background: var(--surface); border-radius: 12px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2); display: flex; flex-direction: column; overflow: hidden; z-index: 1000; opacity: 0; pointer-events: none; transform: translateY(20px); transition: 0.3s; }
        .chatbot-window.show { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .chat-header { background: var(--primary); color: white; padding: 15px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
        .chat-header i { cursor: pointer; }
        .chat-body { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #F9FAFB; }
        .chat-msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .msg-bot { background: white; align-self: flex-start; border-bottom-left-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #E5E7EB; }
        .msg-user { background: var(--primary); color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .chat-input { display: flex; border-top: 1px solid #E5E7EB; padding: 10px; background: white; }
        .chat-input input { flex: 1; border: none; padding: 10px; outline: none; background: #F3F4F6; border-radius: 20px; padding-left: 15px; }
        .chat-input button { background: var(--primary); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; margin-left: 10px; cursor: pointer; }

        /* Footer */
        footer { background: var(--surface); text-align: center; padding: 20px; color: var(--text-light); font-size: 14px; border-top: 1px solid #E5E7EB; margin-top: auto; }
    </style>
</head>
<body>

    <!-- Header / Banner -->
    <header>
        <div class="logo"><i class="fa-solid fa-graduation-cap"></i> EduSystem</div>
        <nav class="nav-links" id="mainNav" style="display: none;">
            <button onclick="switchView('docsView')" id="btn-docsView" class="active"><i class="fa-regular fa-folder-open"></i> Tài liệu</button>
            <button onclick="switchView('testsView')" id="btn-testsView"><i class="fa-solid fa-file-pen"></i> Bài tập</button>
            <button onclick="logout()" class="btn-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất</button>
        </nav>
    </header>

    <!-- Main Content -->
    <main>
        <!-- 1. Trang Đăng Nhập / Đăng Ký -->
        <section id="authView" class="view-section active">
            <div class="auth-container">
                <h2>Bắt đầu học tập</h2>
                <div class="input-group">
                    <label>Email của bạn</label>
                    <input type="email" id="email" placeholder="Ví dụ: hocsinh@gmail.com">
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <div class="input-group">
                    <label>Chọn Lớp</label>
                    <select id="classSelect">
                        <option value="Lớp 10">Lớp 10</option>
                        <option value="Lớp 11">Lớp 11</option>
                        <option value="Lớp 12">Lớp 12</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="btnLogin" onclick="login()">Đăng Nhập</button>
                <button class="btn btn-secondary" id="btnRegister" onclick="register()">Đăng Ký (Dùng thử 1 tháng)</button>
                <p id="authMessage"></p>
            </div>
        </section>

        <!-- 2. Trang Tài Liệu -->
        <section id="docsView" class="view-section">
            <h2 class="page-title">Kho tài liệu <span id="docsClassName" style="color:var(--primary)"></span></h2>
            <div id="materialsList" class="grid-container">
                <!-- Nội dung sẽ được render bằng JS -->
                <p><i class="fa-solid fa-spinner fa-spin"></i> Đang tải tài liệu...</p>
            </div>
        </section>

        <!-- 3. Trang Bài Tập / Kiểm Tra -->
        <section id="testsView" class="view-section">
            <h2 class="page-title">Bài kiểm tra & Bài tập</h2>
            <div id="testsContent">
                <!-- Nội dung bài tập hoặc cảnh báo sẽ hiển thị ở đây -->
            </div>
        </section>
    </main>

    <!-- Chatbot Nổi -->
    <div class="chatbot-toggle" onclick="toggleChat()">
        <i class="fa-solid fa-message"></i>
    </div>
    
    <div class="chatbot-window" id="chatbotWindow">
        <div class="chat-header">
            <span><i class="fa-solid fa-robot"></i> Trợ lý AI (Groq)</span>
            <i class="fa-solid fa-times" onclick="toggleChat()"></i>
        </div>
        <div class="chat-body" id="chatBody">
            <div class="chat-msg msg-bot">Xin chào! Tôi có thể giúp gì cho việc học của bạn hôm nay?</div>
        </div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Nhập câu hỏi..." onkeypress="handleChatEnter(event)">
            <button onclick="sendChat()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        &copy; 2026 EduSystem. Hệ thống quản lý học tập trực tuyến.
    </footer>

    <!-- Logic JavaScript -->
    <script>
        let currentUser = { role: null, lop: null };

        // --- ĐIỀU HƯỚNG VIEW ---
        function switchView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            
            // Cập nhật trạng thái active cho thanh nav
            document.querySelectorAll('.nav-links button').forEach(btn => btn.classList.remove('active'));
            if(document.getElementById('btn-' + viewId)) {
                document.getElementById('btn-' + viewId).classList.add('active');
            }

            // Load dữ liệu khi chuyển tab
            if(viewId === 'docsView') loadMaterials();
            if(viewId === 'testsView') loadTests();
        }

        // --- XỬ LÝ AUTH ---
        function login() {
            let email = document.getElementById("email").value;
            let pass = document.getElementById("password").value;
            let btn = document.getElementById("btnLogin");
            
            if(!email || !pass) return showAuthMsg("Vui lòng nhập đủ thông tin.");
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
            btn.disabled = true;

            google.script.run.withSuccessHandler(function(res) {
                btn.innerHTML = 'Đăng Nhập'; btn.disabled = false;
                
                if(res.status === "success") {
                    currentUser = { role: res.role, lop: res.lop };
                    document.getElementById('mainNav').style.display = 'flex';
                    document.getElementById('docsClassName').innerText = '- ' + currentUser.lop;
                    switchView('docsView'); // Chuyển thẳng vào trang tài liệu
                } else {
                    showAuthMsg(res.message);
                }
            }).loginUser(email, pass);
        }

        function register() {
            let email = document.getElementById("email").value;
            let pass = document.getElementById("password").value;
            let lop = document.getElementById("classSelect").value;
            let btn = document.getElementById("btnRegister");
            
            if(!email || !pass) return showAuthMsg("Vui lòng nhập đủ thông tin.");
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang xử lý...';
            btn.disabled = true;

            google.script.run.withSuccessHandler(function(msg) {
                btn.innerHTML = 'Đăng Ký (Dùng thử 1 tháng)'; btn.disabled = false;
                showAuthMsg(msg, true);
            }).registerUser(email, pass, lop);
        }

        function logout() {
            currentUser = { role: null, lop: null };
            document.getElementById('mainNav').style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('authMessage').innerText = '';
            switchView('authView');
        }

        function showAuthMsg(msg, isSuccess = false) {
            let el = document.getElementById("authMessage");
            el.innerText = msg;
            el.style.color = isSuccess ? "var(--secondary)" : "var(--danger)";
        }

        // --- LẤY DỮ LIỆU TỪ SERVER ---
        function loadMaterials() {
            document.getElementById("materialsList").innerHTML = '<p><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu từ Google Drive...</p>';
            google.script.run.withSuccessHandler(function(files) {
                let html = "";
                if(files.length === 0) {
                    html = "<p>Chưa có tài liệu nào cho lớp này.</p>";
                } else {
                    files.forEach(f => {
                        html += `
                            <div class="card">
                                <i class="fa-solid fa-file-pdf"></i>
                                <h4>${f.name}</h4>
                                <a href="${f.url}" target="_blank">Xem / Tải về</a>
                            </div>
                        `;
                    });
                }
                document.getElementById("materialsList").innerHTML = html;
            }).getMaterials(currentUser.lop);
        }

        function loadTests() {
            let container = document.getElementById("testsContent");
            
            // Chặn quyền Trial
            if(currentUser.role === "trial") {
                container.innerHTML = `
                    <div class="alert-box">
                        <i class="fa-solid fa-lock"></i> Tính năng làm bài kiểm tra bị khóa đối với Tài khoản Dùng thử.<br>
                        Vui lòng liên hệ Giáo viên để được cấp tài khoản Học sinh chính thức.
                    </div>`;
                return;
            }

            container.innerHTML = '<p><i class="fa-solid fa-spinner fa-spin"></i> Đang tải danh sách bài tập...</p>';
            
            google.script.run.withSuccessHandler(function(tests) {
                let html = '<div class="grid-container">';
                if(tests.length === 0) {
                    html = "<p>Chưa có bài kiểm tra nào.</p>";
                } else {
                    tests.forEach(t => {
                        html += `
                            <div class="card">
                                <i class="fa-solid fa-laptop-file"></i>
                                <h4>${t.name}</h4>
                                <a href="${t.url}" target="_blank">Làm bài ngay</a>
                            </div>
                        `;
                    });
                    html += '</div>';
                }
                container.innerHTML = html;
            }).getTests(currentUser.lop); // Cần hàm getTests ở file Code.gs
        }

        // --- CHATBOT LOGIC ---
        function toggleChat() {
            document.getElementById('chatbotWindow').classList.toggle('show');
        }

        function handleChatEnter(e) {
            if(e.key === 'Enter') sendChat();
        }

        function sendChat() {
            let input = document.getElementById("chatInput");
            let msg = input.value.trim();
            if(!msg) return;

            let chatBody = document.getElementById("chatBody");
            
            // Add user message
            chatBody.innerHTML += `<div class="chat-msg msg-user">${msg}</div>`;
            input.value = "";
            
            // Add loading bot message
            let loadingId = 'loading-' + Date.now();
            chatBody.innerHTML += `<div class="chat-msg msg-bot" id="${loadingId}"><i class="fa-solid fa-ellipsis fa-fade"></i></div>`;
            chatBody.scrollTop = chatBody.scrollHeight;

            // Call API
            google.script.run.withSuccessHandler(function(response) {
                document.getElementById(loadingId).innerText = response;
                chatBody.scrollTop = chatBody.scrollHeight;
            }).chatWithGroq(msg);
        }
    </script>
</body>
</html>
